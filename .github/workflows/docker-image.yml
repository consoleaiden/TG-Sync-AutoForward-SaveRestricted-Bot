name: Build Docker Image

# 每次推送代码到 main 自动构建并发布镜像；打 v* 标签时额外生成版本 tag
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # github.repository 是 consoleaiden/TG-Sync-...，metadata-action 会自动转小写
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 群晖可能是 x86_64 也可能是 ARM 机型，双架构一次构建到位
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag 规则：
      #   main 分支推送  -> latest + sha-xxxxxxx
      #   v1.2.3 标签    -> 1.2.3 / 1.2 / 1 + latest
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 已发布镜像" >> $GITHUB_STEP_SUMMARY
          for t in ${{ steps.meta.outputs.tags }}; do echo "- \`$t\`" >> $GITHUB_STEP_SUMMARY; done
