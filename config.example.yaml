# Telegram API 配置（从 https://my.telegram.org 获取）
api_id: 12345678
api_hash: "your_api_hash_here"

# Bot Token（从 @BotFather 获取）
bot_token: "your_bot_token_here"

# UserBot 手机号配置（国际格式，如 +8613800138000）
# 支持单个手机号（兼容旧版）：
# phone: "+8613800138000"
# 或按优先级顺序配置多个 UserBot（遇到私有群时将按从上到下的顺序依次探测）：
phones:
  - "+8613800138000"
  - "+852000000"

# 管理员 Telegram User ID 列表
admin_ids:
  - 123456789

# 限流配置
rate_limit:
  batch_size: 100 # 每批获取消息数
  forward_interval: [1, 2] # 每条转发间隔范围（秒）
  batch_pause_every: 50 # 每转发N条后休息
  batch_pause_time: [30, 60] # 休息时间范围（秒）
  flood_wait_multiplier: 2 # FloodWait后间隔翻倍系数
  max_flood_wait: 300 # 最大等待时间（秒），超过则暂停并通知

# 传输性能调优（下载+上传链路）
transfer:
  enable_fast_transfer: true # 是否启用 FastTelethon 多连接并发传输加速
  fast_download_connections: 6 # 下载并发连接数（推荐 4-8，UserBot 拉流）
  fast_upload_connections: 4 # 上传并发连接数（推荐 3-4，Bot 传输）
  fast_transfer_connections: 4 # 兼容兜底并发连接数（未单独指定时生效）
  fast_transfer_min_size_mb: 10 # 启用多连接的最小文件体积（低于此值走原生传输）
  album_download_concurrency: 3 # 相册并发下载数（建议 2-4）
  upload_part_size_kb: 512 # 上传分片大小，范围 32-512
  download_part_size_kb: 512 # 下载分片大小，范围 32-512（部分 Telethon 版本可能忽略）

# 是否允许非管理员使用链接解析
allow_public_resolve: true

# 私聊解析返回消息时，是否在文字末尾嵌入原消息来源链接（格式：[Source Link](url)）
append_source_link: true

# ── 克隆任务 ─────────────────────────────────────────────────────────────
clone:
  # 进程重启（崩溃 / 换代理重启 / 更新部署）后自动从断点继续未完成的克隆任务。
  # 设为 false 则重启后把中断的任务置为「已暂停」，需要手动点「继续」。
  auto_resume: true
  # 每批拉取的消息条数（流式处理，不一次性载入整个频道；相册不会被切到两批）
  batch_size: 200
  # 每成功转发 N 条刷新一次进度显示（会编辑同一条消息，不会刷屏）
  progress_notify_every: 50

# ── MTProto 代理自动选优（网络无法直连 Telegram 时启用）────────────────
# 数据来源：telegram-mtproto-proxy-list 项目每小时更新的 top40.json；
# 本机对榜单代理做真实 FakeTLS 握手测速后选出最优，写入 data/proxy.json。
proxy:
  mode: auto # off=直连 | auto=自动选优（推荐） | manual=使用下方固定代理
  refresh_minutes: 60 # auto 模式复测周期（分钟，最小 5）
  state_file: data/proxy.json # 选优结果状态文件
  # 当前代理仍可用时，新最优代理需比它快这个比例才切换（0.7=快 30% 才切）；
  # 设为 1.0 则每小时严格切换到榜单最优。当前代理失效时无论如何都会切换。
  switch_improve_ratio: 0.7
  # top40.json 镜像地址（依次尝试；留空使用内置镜像列表：jsdelivr 多节点、
  # raw.githubusercontent、gh-proxy。国内网络建议把可达的排前面）
  sources: []
  probe: # 本地测速参数
    concurrency: 40 # 并发探测数
    attempts: 2 # 每台探测次数（取中位数）
    timeout: 6 # 握手超时（秒）
    connect_timeout: 5 # TCP 建连超时（秒）
    # 握手通过不等于能传数据：对握手排序前 N 名再发一次真实 req_pq 验证
    dc_validate_top: 8
    dc_validate_timeout: 8
  # 连接保活间隔（秒）。Telethon 默认 60 秒才发心跳，而公共代理多在 45~55 秒
  # 空闲后断连，因此默认 20 秒。设为 0 可关闭补丁（恢复 Telethon 原生行为）。
  keepalive_seconds: 20
  manual: # mode: manual 时的固定代理（从 t.me/proxy 链接复制）
    server: ""
    port: 443
    secret: ""

