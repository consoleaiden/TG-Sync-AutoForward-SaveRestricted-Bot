# 固定 project 名：无论从哪个目录执行 docker compose，都归到同一个项目，
# 避免「换个目录 up 就报 container name already in use」
name: tg-sync-bot

services:
  bot:
    # 使用 CI 构建的官方镜像（docker compose up -d 时自动拉取）
    image: ghcr.io/consoleaiden/tg-sync-autoforward-saverestricted-bot:latest
    # 本地开发想用源码构建时，取消下行注释并执行 docker compose up -d --build
    # build: .
    container_name: tg-sync-bot
    restart: unless-stopped
    environment:
      # 日志时间与宿主机对齐（镜像内已装 tzdata）
      TZ: ${TZ:-Asia/Shanghai}
      # 数据库位置。默认 data/bot.db；只有改了 config.yaml 的 storage.db_path
      # 或想把库放到别的目录时才需要取消注释（优先级高于配置文件）。
      # TG_DB_PATH: /app/data/bot.db
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # ⬇ 克隆进度/Task/消息映射都在 /app/data/bot.db（WAL 另有 bot.db-wal、bot.db-shm）
      #   这一行是「升级镜像不丢进度」的关键：目录挂到宿主机，容器重建也不影响
      - ./data:/app/data
      - ./sessions:/app/sessions
      # 想把数据库单独放一个目录时用下面这条，并把 TG_DB_PATH 指到 /app/db/bot.db
      # （注意：不要直接挂载单个 bot.db 文件，首次启动 Docker 会把它建成目录）
      # - ./db:/app/db
    # 停止时给进程留出把 WAL 合并回主库的时间（默认 10s 也够用，WAL 本身可恢复）
    stop_grace_period: 20s
    labels:
      # 只让下面的 watchtower 盯着这个容器自动升级（其它容器一律不碰）
      - "com.centurylinklabs.watchtower.enable=true"

  # ── 自动更新：CI 构建好新镜像后，这里定时检查并原地重建 bot ──────────────
  # 一次性 `docker compose up -d` 之后就不用再 SSH 进来 pull 了；
  # 只换镜像，不改 compose 里的新挂载/新环境变量（那种仍需手动 up -d 一次）。
  watchtower:
    # 上游 containrrr/watchtower 已于 2025-12 归档，改用维护中的 fork（接口完全兼容）
    # 用 ghcr 源，国内拉取比 Docker Hub 稳；版本固定，避免它把自己升级坏
    image: ghcr.io/nicholas-fedor/watchtower:1.19.0
    container_name: tg-sync-watchtower
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 检查间隔（秒）：600 = 每 10 分钟看一次有没有新镜像
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-600}
      # 升级后删掉旧镜像，避免 NAS 磁盘被历史层堆满
      WATCHTOWER_CLEANUP: "true"
      # 只处理带 watchtower.enable=true 标签的容器（即上面的 bot）
      WATCHTOWER_LABEL_ENABLE: "true"
      # 私有 GHCR 包才需要：把 `docker login ghcr.io` 得到的 config.json 挂进来
      # WATCHTOWER_REGISTRY_AUTH: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # - /root/.docker/config.json:/config.json:ro
